name: Refresh listings and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install refresh browser
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium

      - name: Refresh exact listings
        if: github.event_name != 'push'
        run: npm run refresh

      - name: Validate data
        run: npm test

      - name: Build site
        run: npm run build

      - name: Save successful refresh
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- refresh-state.js; then
            exit 0
          fi
          git config user.name "rincon-rent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refresh-state.js
          git commit -m "data: daily listing refresh [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
